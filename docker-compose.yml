version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: sujju_foods_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: sujju_foods
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
